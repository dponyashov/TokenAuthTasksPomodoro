## NestJs
  backend-nestjs:
    image: jtp-back-nestjs:0.0.1
    build:
      dockerfile: docker/back/nestjs/Dockerfile
      context: .
    container_name: jtp-back-nestjs
#    restart: always
    ports:
      - ${BACK_PORT}:5173
    environment:
      # DB_URL: jdbc:postgresql://db:5432/${DB_NAME} #внутри используем внутренний порт постгресс
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_PORT: 5432  #${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      FRONT_URL: ${FRONT_URL}
    depends_on:
      - db

