version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: jtp-db
    restart: always
    ports:
      - ${DB_PORT}:5432
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_PORT: ${DB_PORT}
    volumes:
      - ./var/db/postgresql:/var/lib/postgresql/data:rw

  backend:
    image: jtp-back:0.0.1
    build:
      dockerfile: docker/back/Dockerfile
      context: .
    container_name: jtp-back
    restart: always
    ports:
      - ${BACK_PORT}:8080
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME} #внутри используем внутренний порт постгресс
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      FRONT_URL: ${FRONT_URL}
    depends_on:
      - db
      
  frontend:
    image: jtp-front:0.0.1
    build:
      dockerfile: docker/front/Dockerfile
      args:
        - VITE_BACK_URL=${BACK_URL} # Передаем переменную из .env хоста в Dockerfile
      context: .
    container_name: jtp-front
    restart: always
    ports:
      - ${FRONT_PORT}:80
    # environment:
    #   VITE_BACK_URL: ${BACK_URL}
    depends_on:
      - backend