version: '3.8'

services:
  db:
    image: postgres:17-alpine
    # user: 1000:1000             #чтобы не было проблем с доступом к папкам из volumes(иначе доступ под root) 
    container_name: jtp-db
#    restart: always
    ports:
      - ${DB_PORT}:5432
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_PORT: ${DB_PORT}
    volumes:
      - ./var/db/postgresql:/var/lib/postgresql/data:rw


